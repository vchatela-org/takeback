name: Tests

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Match the runtime the container ships (see Dockerfile).
          python-version: '3.14'

      - name: Install test dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
