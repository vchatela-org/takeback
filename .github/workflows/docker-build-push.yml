name: Build and Push Docker Image to GHCR

# The public image the cluster pulls, built on a GitHub-hosted runner so this
# repository's code never runs on the organisation's self-hosted runners — whose
# token can read cluster secrets, and which no longer accept public repositories.
# Release tags publish a version; a push to main keeps `latest` and a `sha-<short>`
# tag current, and the build is gated on Trivy.
#
# See vchatela-org/shared-workflows, docker-build-push-ghcr.yml.

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Least privilege by default; the job grants what it needs.
permissions:
  contents: read

jobs:
  docker-build-push:
    # Only here: a fork has neither the token nor the package.
    if: github.repository == 'vchatela-org/takeback'
    permissions:
      contents: read
      packages: write
    uses: vchatela-org/shared-workflows/.github/workflows/docker-build-push-ghcr.yml@acd8755fe85c59123b7c7eace5dc6be7d93d781d # v1.3.0
    with:
      image_name: takeback
