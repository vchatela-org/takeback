name: Build and Push Docker Image to Harbor

# The owner's own registry, for their deployment. Release tags only, and
# only in this repository (a fork has neither the runner nor the secrets).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# Least privilege by default; the reusable workflow requests what it needs.
permissions:
  contents: read

jobs:
  docker-build-push-scan:
    if: github.repository == 'vchatela-org/takeback'
    uses: vchatela-org/shared-workflows/.github/workflows/docker-build-push-harbor.yml@4cb24e328e87d6f11a53ba4ea81ad2ad89c18d22 # v1.2.0
    with:
      harbor_registry: ${{ vars.HARBOR_REGISTRY }}
      harbor_project: ${{ vars.HARBOR_PROJECT }}
      harbor_image: ${{ vars.HARBOR_IMAGE }}
    secrets:
      harbor_username: ${{ secrets.HARBOR_USERNAME }}
      harbor_password: ${{ secrets.HARBOR_PASSWORD }}
