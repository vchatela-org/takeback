<div class="instagram-preview" data-instagram-url="{{ url }}">
  <a href="{{ url }}" target="_blank" rel="noopener" class="d-block small mb-1 text-truncate instagram-preview-link">{{ url }}</a>
  <button type="button" class="btn btn-sm btn-light border load-instagram-preview">
    <i class="bi bi-play-circle me-1"></i>Charger l'aperçu (photo/vidéo)
  </button>
  <div class="instagram-embed-slot mt-2"></div>
</div>
